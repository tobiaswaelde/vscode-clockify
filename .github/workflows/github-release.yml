name: GitHub Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - id: release
        name: Read release metadata
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "vsix=clockify-tracker-${version}.vsix" >> "$GITHUB_OUTPUT"
          echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Package VSIX
        run: yarn package:vsix --out "${{ steps.release.outputs.vsix }}"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET: ${{ steps.release.outputs.target }}
          VSIX: ${{ steps.release.outputs.vsix }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" \
              --target "$TARGET" \
              --title "$TAG" \
              --generate-notes
          fi
